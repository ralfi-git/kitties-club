                        (y + row * scale) * PIXEL_SIZE,
                        PIXEL_SIZE * scale,

            pole.x = cols * 0.7;

        }
        updatePolePosition();

        // Draw the pole
        function drawPole() {
            if (!pole.x || !pole.bottomY) return;  // safety check

            const poleColor = '#c0c0c0';  // silver
            const poleHighlight = '#e8e8e8';
            const poleShadow = '#808080';

            // Main pole body - simple vertical rectangle
            ctx.fillStyle = poleShadow;
            ctx.fillRect((pole.x - 1) * PIXEL_SIZE, pole.topY * PIXEL_SIZE, PIXEL_SIZE, (pole.bottomY - pole.topY) * PIXEL_SIZE);

            ctx.fillStyle = poleColor;
            ctx.fillRect(pole.x * PIXEL_SIZE, pole.topY * PIXEL_SIZE, PIXEL_SIZE * pole.width, (pole.bottomY - pole.topY) * PIXEL_SIZE);

            ctx.fillStyle = poleHighlight;
            ctx.fillRect((pole.x + pole.width) * PIXEL_SIZE, pole.topY * PIXEL_SIZE, PIXEL_SIZE, (pole.bottomY - pole.topY) * PIXEL_SIZE);

            // Top cap

        // Draw star (exact hamam style - 4-point sparkle with fading rays)
        function drawStar(star, alpha) {
            const px = star.x * PIXEL_SIZE;
            const py = star.y * PIXEL_SIZE;
            const ps = PIXEL_SIZE;
            const c = star.color;

            if (star.size === 0) {
                // Tiny dot
                ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
                ctx.fillRect(px, py, ps, ps);
            } else {
                // 4-point sparkle (classic Loom style)
                // Bright white center
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(px, py, ps, ps);

                // 4 points - colored
                ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha * 0.8})`;
                ctx.fillRect(px - ps, py, ps, ps); // left
                ctx.fillRect(px + ps, py, ps, ps); // right
                ctx.fillRect(px, py - ps, ps, ps); // top
                ctx.fillRect(px, py + ps, ps, ps); // bottom

                if (star.size >= 2) {
                    // Extended points for larger stars
                    ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha * 0.5})`;
                    ctx.fillRect(px - ps * 2, py, ps, ps);
                    ctx.fillRect(px + ps * 2, py, ps, ps);
                    ctx.fillRect(px, py - ps * 2, ps, ps);
                    ctx.fillRect(px, py + ps * 2, ps, ps);
                }

                if (star.size >= 3) {
                    // Even longer points
                    ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha * 0.3})`;
                    ctx.fillRect(px - ps * 3, py, ps, ps);
                    ctx.fillRect(px + ps * 3, py, ps, ps);
                    ctx.fillRect(px, py - ps * 3, ps, ps);
                    ctx.fillRect(px, py + ps * 3, ps, ps);
                }

                if (star.size >= 4) {
                    // Very long points
                    ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha * 0.2})`;
                    ctx.fillRect(px - ps * 4, py, ps, ps);
                    ctx.fillRect(px + ps * 4, py, ps, ps);
                    ctx.fillRect(px, py - ps * 4, ps, ps);
                    ctx.fillRect(px, py + ps * 4, ps, ps);
                    ctx.fillRect(px - ps * 5, py, ps, ps);
                    ctx.fillRect(px + ps * 5, py, ps, ps);
                    ctx.fillRect(px, py - ps * 5, ps, ps);
                    ctx.fillRect(px, py + ps * 5, ps, ps);
                }

                if (star.size >= 5) {
                    // Huge stars - very long rays
                    ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha * 0.15})`;
                    for (let r = 6; r <= 8; r++) {
                        ctx.fillRect(px - ps * r, py, ps, ps);
                        ctx.fillRect(px + ps * r, py, ps, ps);
                        ctx.fillRect(px, py - ps * r, ps, ps);
                        ctx.fillRect(px, py + ps * r, ps, ps);
                    }
                }

                if (star.size >= 6) {
                    // Giant stars
                    ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha * 0.1})`;
                    for (let r = 9; r <= 11; r++) {
                        ctx.fillRect(px - ps * r, py, ps, ps);
                        ctx.fillRect(px + ps * r, py, ps, ps);
                        ctx.fillRect(px, py - ps * r, ps, ps);
                        ctx.fillRect(px, py + ps * r, ps, ps);
                    }
                }

                if (star.size >= 7) {
                    // Massive stars
                    ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha * 0.07})`;
                    for (let r = 12; r <= 15; r++) {
                        ctx.fillRect(px - ps * r, py, ps, ps);
                        ctx.fillRect(px + ps * r, py, ps, ps);
                        ctx.fillRect(px, py - ps * r, ps, ps);
                        ctx.fillRect(px, py + ps * r, ps, ps);
                    }
                }

                // 6-spike stars: add diagonal rays
                if (star.spikes === 6 && star.size >= 1) {
                    const diagLen = Math.max(1, Math.floor(star.size * 0.7));
                    for (let d = 1; d <= diagLen; d++) {
                        const diagAlpha = alpha * 0.5 * (1 - d / (diagLen + 2));
                        ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${diagAlpha})`;
                        ctx.fillRect(px - ps * d, py - ps * d, ps, ps);
                        ctx.fillRect(px + ps * d, py + ps * d, ps, ps);
                    }
                }
            }
        }

        function drawSprite(sprite, x, y, scale, flip) {
            for (let row = 0; row < sprite.length; row++) {
                for (let col = 0; col < sprite[row].length; col++) {
                    const pixel = sprite[row][flip ? sprite[row].length - 1 - col : col];
                    if (pixel === 0) continue;
                    const color = COLORS[pixel] || '#ff00ff';
                    ctx.fillStyle = color;
                    ctx.fillRect(
                        (x + col * scale) * PIXEL_SIZE,
                        (y + row * scale) * PIXEL_SIZE,
                        PIXEL_SIZE * scale,
                        PIXEL_SIZE * scale
                    );
                }
            }
        }

        function drawFloatie(f) {
            // Twinkle effect for sparkles
            let alpha = 1;
            if (f.type === 'sparkle') {
                f.twinkle += 0.1;
                alpha = 0.5 + 0.5 * Math.sin(f.twinkle);
            }

            // Shiny sparkle effect for peaches and eggplants
            if (f.type === 'peach' || f.type === 'eggplant') {
                f.twinkle += 0.08;
                const shine = 0.7 + 0.3 * Math.sin(f.twinkle);

                for (let row = 0; row < f.sprite.length; row++) {
                    for (let col = 0; col < f.sprite[row].length; col++) {
                        const pixel = f.sprite[row][col];
                        if (pixel === 0) continue;

                        // Color based on pixel value: 1 = body, 2 = leaf/stem
                        if (pixel === 2) {
                            ctx.fillStyle = f.type === 'peach' ? f.color.leaf : f.color.stem;
                        } else {
                            ctx.fillStyle = f.color.body;
                        }
                        ctx.globalAlpha = 1;
                        ctx.fillRect(
                            (f.x + col * f.scale) * PIXEL_SIZE,
                            (f.y + row * f.scale) * PIXEL_SIZE,
                            PIXEL_SIZE * f.scale,
                            PIXEL_SIZE * f.scale
                        );

                        // Add sparkle shine overlay on body
                        if (pixel === 1 && (row + col) % 3 === 0) {
                            ctx.fillStyle = f.color.shine || '#ffffff';
                            ctx.globalAlpha = shine * 0.6;
                            ctx.fillRect(
                                (f.x + col * f.scale) * PIXEL_SIZE,
                                (f.y + row * f.scale) * PIXEL_SIZE,
                                PIXEL_SIZE * f.scale * 0.5,
                                PIXEL_SIZE * f.scale * 0.5
                            );
                        }
                    }
                }
                ctx.globalAlpha = 1;
                return;
            }

            for (let row = 0; row < f.sprite.length; row++) {
                for (let col = 0; col < f.sprite[row].length; col++) {
                    const pixel = f.sprite[row][col];
                    if (pixel === 0) continue;
                    ctx.fillStyle = f.color;
                    ctx.globalAlpha = alpha;
                    ctx.fillRect(
                        (f.x + col * f.scale) * PIXEL_SIZE,
                        (f.y + row * f.scale) * PIXEL_SIZE,
                        PIXEL_SIZE * f.scale,
                        PIXEL_SIZE * f.scale
                    );
                }
            }
            ctx.globalAlpha = 1;
        }

        // Draw Hello Kitty with her own colors
        function drawKitty(sprite, x, y, scale, flip) {
            for (let row = 0; row < sprite.length; row++) {
                for (let col = 0; col < sprite[row].length; col++) {
                    const pixel = sprite[row][flip ? sprite[row].length - 1 - col : col];
                    if (pixel === 0) continue;
                    const color = KITTY_SPRITE_COLORS[pixel] || '#ff00ff';
                    ctx.fillStyle = color;
                    ctx.fillRect(
                        (x + col * scale) * PIXEL_SIZE,
                        (y + row * scale) * PIXEL_SIZE,
                        PIXEL_SIZE * scale,
                        PIXEL_SIZE * scale
                    );
                }
            }
        }

        function animate() {
            // Dark black background
            ctx.fillStyle = '#030303';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Red spotlights - animated pulsing and swaying
            const time = Date.now();
            const spotPulse = 0.8 + Math.sin(time * 0.002) * 0.2;
            const spotPulse2 = 0.8 + Math.sin(time * 0.0025 + 1) * 0.2;
            const spotPulse3 = 0.85 + Math.sin(time * 0.003 + 2) * 0.15;

            // Sway motion for moving lights
            const sway1 = Math.sin(time * 0.001) * 60;
            const sway2 = Math.sin(time * 0.0008 + 2) * 50;
            const sway3 = Math.sin(time * 0.0012 + 1) * 40;

            const poleX = pole.x * PIXEL_SIZE;

            // Stage light cone 1 - from top left, swaying
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(poleX - 250 + sway1, 0);
            ctx.lineTo(poleX - 120 + sway1 * 0.3, canvas.height);
            ctx.lineTo(poleX + 80 + sway1 * 0.3, canvas.height);
            ctx.closePath();
            const cone1Gradient = ctx.createLinearGradient(poleX - 250 + sway1, 0, poleX + sway1 * 0.3, canvas.height * 0.7);
            cone1Gradient.addColorStop(0, 'rgba(255, 20, 20, 0.5)');
            cone1Gradient.addColorStop(0.2, 'rgba(255, 0, 0, 0.3)');
            cone1Gradient.addColorStop(0.5, 'rgba(200, 0, 0, 0.15)');
            cone1Gradient.addColorStop(1, 'rgba(100, 0, 0, 0.03)');
            ctx.fillStyle = cone1Gradient;
            ctx.globalAlpha = spotPulse;
            ctx.fill();
            ctx.restore();

            // Stage light cone 2 - from top right, swaying opposite
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(poleX + 250 + sway2, 0);
            ctx.lineTo(poleX + 120 + sway2 * 0.3, canvas.height);
            ctx.lineTo(poleX - 80 + sway2 * 0.3, canvas.height);
            ctx.closePath();
            const cone2Gradient = ctx.createLinearGradient(poleX + 250 + sway2, 0, poleX + sway2 * 0.3, canvas.height * 0.7);
            cone2Gradient.addColorStop(0, 'rgba(255, 40, 60, 0.45)');
            cone2Gradient.addColorStop(0.2, 'rgba(255, 0, 30, 0.25)');
            cone2Gradient.addColorStop(0.5, 'rgba(180, 0, 20, 0.12)');
            cone2Gradient.addColorStop(1, 'rgba(80, 0, 10, 0.02)');
            ctx.fillStyle = cone2Gradient;
            ctx.globalAlpha = spotPulse2;
            ctx.fill();
            ctx.restore();

            // Stage light cone 3 - center, slight sway (brightest)
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(poleX + sway3 * 0.5, 0);
            ctx.lineTo(poleX - 180 + sway3 * 0.2, canvas.height);
            ctx.lineTo(poleX + 180 + sway3 * 0.2, canvas.height);
            ctx.closePath();
            const cone3Gradient = ctx.createLinearGradient(poleX, 0, poleX, canvas.height);
            cone3Gradient.addColorStop(0, 'rgba(255, 30, 50, 0.55)');
            cone3Gradient.addColorStop(0.15, 'rgba(255, 20, 40, 0.35)');
            cone3Gradient.addColorStop(0.4, 'rgba(220, 0, 30, 0.18)');
            cone3Gradient.addColorStop(0.7, 'rgba(150, 0, 20, 0.08)');
            cone3Gradient.addColorStop(1, 'rgba(80, 0, 10, 0.02)');
            ctx.fillStyle = cone3Gradient;
            ctx.globalAlpha = spotPulse3;
            ctx.fill();
            ctx.restore();

            // Main radial spotlight glow on pole area
            const poleSpotY = canvas.height * 0.5;
            const poleSpotGradient = ctx.createRadialGradient(poleX, poleSpotY, 0, poleX, poleSpotY, 400 * spotPulse);
            poleSpotGradient.addColorStop(0, 'rgba(255, 60, 60, 0.3)');
            poleSpotGradient.addColorStop(0.15, 'rgba(255, 30, 40, 0.18)');
            poleSpotGradient.addColorStop(0.4, 'rgba(200, 0, 30, 0.08)');
            poleSpotGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = poleSpotGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Floor reflection glow
            const floorGlow = ctx.createRadialGradient(poleX, canvas.height * 0.9, 0, poleX, canvas.height * 0.9, 250);
            floorGlow.addColorStop(0, 'rgba(255, 30, 30, 0.15)');
            floorGlow.addColorStop(0.5, 'rgba(200, 0, 20, 0.06)');
            floorGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = floorGlow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the pole
            drawPole();

            // Draw the bar area on the left
            const barX = 20;
            const barY = canvas.height * 0.45;
            const barWidth = 200;
            const barHeight = canvas.height * 0.55;

            // Bar back wall - rich wood paneling (stops at foot rail)
            const backWallHeight = 280;  // from barY-180 to barY+100 (foot rail)
            ctx.fillStyle = '#2a1a0a';
            ctx.fillRect(barX, barY - 180, barWidth, backWallHeight);

            // Wood grain vertical stripes
            for (let i = 0; i < 12; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#3d2510' : '#2a1a0a';
                ctx.fillRect(barX + i * 17, barY - 180, 17, backWallHeight);
            }

            // Decorative top molding
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(barX - 5, barY - 185, barWidth + 10, 8);
            ctx.fillStyle = '#6a4a2a';
            ctx.fillRect(barX - 5, barY - 185, barWidth + 10, 3);

            // Hanging lights at top (higher up)
            for (let i = 0; i < 5; i++) {
                const lightX = barX + 20 + i * 38;
                const lightY = barY - 170;
                // Wire
                ctx.fillStyle = '#333';
                ctx.fillRect(lightX + 4, lightY - 15, 2, 15);
                // Bulb glow
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(lightX + 5, lightY + 5, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Shelves with bottles - 3 shelves
            for (let shelf = 0; shelf < 3; shelf++) {
                const shelfY = barY - 120 + shelf * 38;
                // Shelf bracket
                ctx.fillStyle = '#4a2a15';
                ctx.fillRect(barX + 5, shelfY, barWidth - 10, 6);
                // Shelf top highlight
                ctx.fillStyle = '#6a4a2a';
                ctx.fillRect(barX + 5, shelfY, barWidth - 10, 2);

                // Bottles on this shelf - 7 per shelf
                for (let b = 0; b < 7; b++) {
                    const bottle = barBottles[shelf * 7 + b] || barBottles[b % barBottles.length];
                    const bx = barX + 10 + b * 27;
                    const by = shelfY - bottle.sprite.length * 3;
                    const ps = 3;  // pixel size for bottles
                    for (let row = 0; row < bottle.sprite.length; row++) {
                        for (let col = 0; col < bottle.sprite[row].length; col++) {
                            const pixel = bottle.sprite[row][col];
                            if (pixel === 0) continue;
                            // Color based on pixel value: 1=body, 2=cap, 3=label, 4=accent
                            if (pixel === 1) ctx.fillStyle = bottle.body;
                            else if (pixel === 2) ctx.fillStyle = bottle.cap;
                            else if (pixel === 3) ctx.fillStyle = bottle.label;
                            else if (pixel === 4) ctx.fillStyle = bottle.accent;
                            ctx.fillRect(bx + col * ps, by + row * ps, ps, ps);
                        }
                    }
                    // Bottle shine
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.fillRect(bx + ps, by + ps * 2, ps * 0.7, bottle.sprite.length * ps * 0.6);
                }
            }

            // Update and draw bartender (BEFORE counter so she's behind it)
            bartender.x = barX / PIXEL_SIZE + 25;
            bartender.y = (barY - 60) / PIXEL_SIZE;

            bartender.frameTimer++;
            if (bartender.frameTimer > 15) {
                bartender.frameTimer = 0;
                bartender.frame = (bartender.frame + 1) % BARTENDER_POSES[bartender.poseIndex].frames.length;
            }

            const bartenderPose = BARTENDER_POSES[bartender.poseIndex];
            const bartenderSprite = bartenderPose.frames[bartender.frame % bartenderPose.frames.length];
            drawBartender(bartenderSprite, bartender.x, bartender.y, bartender.scale, false);

            // Bar counter top - rich wood with edge
            ctx.fillStyle = '#5a3520';
            ctx.fillRect(barX - 10, barY + 15, barWidth + 30, 18);
            // Counter top surface
            ctx.fillStyle = '#6a4530';
            ctx.fillRect(barX - 10, barY + 15, barWidth + 30, 6);
            // Edge highlight
            ctx.fillStyle = '#7a5540';
            ctx.fillRect(barX - 10, barY + 15, barWidth + 30, 2);

            // Counter front - vertical wood panels (ends at foot rail)
            const counterHeight = 67;  // stops at foot rail
            ctx.fillStyle = '#3a2010';
            ctx.fillRect(barX - 10, barY + 33, barWidth + 30, counterHeight);
            // Wood grain on counter front
            for (let i = 0; i < 8; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#4a2a15' : '#3a2010';
                ctx.fillRect(barX - 10 + i * 28, barY + 33, 28, counterHeight);
            }
            // Counter front top edge
            ctx.fillStyle = '#5a3a20';
            ctx.fillRect(barX - 10, barY + 33, barWidth + 30, 4);

            // Bar stools (2 stools)
            for (let stool = 0; stool < 2; stool++) {
                const stoolX = barX + 40 + stool * 90;
                const stoolY = barY + 80;
                // Stool post (gold)
                ctx.fillStyle = '#b8860b';
                ctx.fillRect(stoolX + 8, stoolY, 6, 60);
                // Post shine
                ctx.fillStyle = '#daa520';
                ctx.fillRect(stoolX + 9, stoolY, 2, 60);
                // Stool base
                ctx.fillStyle = '#8b7355';
                ctx.fillRect(stoolX, stoolY + 58, 22, 6);
                // Seat (round-ish)
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(stoolX - 2, stoolY - 8, 26, 12);
                ctx.fillStyle = '#a0522d';
                ctx.fillRect(stoolX, stoolY - 6, 22, 8);
                // Seat highlight
                ctx.fillStyle = '#cd853f';
                ctx.fillRect(stoolX + 2, stoolY - 4, 18, 3);
            }

            // Foot rail (brass)
            ctx.fillStyle = '#b8860b';
            ctx.fillRect(barX, barY + 100, barWidth + 10, 4);
            ctx.fillStyle = '#daa520';
            ctx.fillRect(barX, barY + 100, barWidth + 10, 1);

            // Hello Kitty bar visit logic
            kittyAtBar.cooldown--;
            if (!kittyAtBar.visiting && kittyAtBar.cooldown <= 0 && Math.random() < 0.003) {
                kittyAtBar.visiting = true;
                kittyAtBar.waitingForDrink = true;
                kittyAtBar.cheering = false;
                kittyAtBar.drinkOnBar = false;
                kittyAtBar.pickedUp = false;
                kittyAtBar.drinkTimer = 0;
                // Start Kitty walking away from bar while waiting
                kitty.dirX = 0.5 + Math.random() * 0.5;  // move right (away from bar)
                kitty.dirY = (Math.random() - 0.5) * 0.5;
                // If there's an empty glass, bartender cleans it first
                if (kittyAtBar.emptyGlassOnBar) {
                    bartenderCleaning.active = true;
                    bartenderCleaning.timer = 0;
                } else {
                    bartender.makingDrink = true;
                    bartender.drinkTimer = 0;
                }
            }

            // Bartender cleaning empty glass first
            if (bartenderCleaning.active) {
                bartenderCleaning.timer++;
                bartender.poseIndex = 0; // idle/cleaning pose
                if (bartenderCleaning.timer > 60) {
                    // Done cleaning, now make new drink
                    bartenderCleaning.active = false;
                    kittyAtBar.emptyGlassOnBar = false;
                    bartender.makingDrink = true;
                    bartender.drinkTimer = 0;
                }
            }
            // Bartender makes drink when Kitty visits - shake then pour
            else if (bartender.makingDrink) {
                bartender.drinkTimer++;
                if (bartender.drinkTimer < 90) {
                    // Shaking the cocktail shaker
                    bartender.poseIndex = 3; // shaking
                } else if (bartender.drinkTimer < 130) {
                    // Pouring into glass
                    bartender.poseIndex = 1; // pouring
                } else {
                    // Done - drink ready on counter
                    bartender.makingDrink = false;
                    kittyAtBar.drinkOnBar = true;
                    kittyAtBar.waitingForDrink = false;
                    kittyAtBar.cheering = true;
                    kittyAtBar.cheerTimer = 60;  // cheer for ~1 second
                    kittyAtBar.drinkX = barX + barWidth - 30;
                    kittyAtBar.drinkY = barY - 20;
                }
            } else {
                bartender.poseTimer++;
                if (bartender.poseTimer > BARTENDER_POSES[bartender.poseIndex].duration / 16) {
                    bartender.poseTimer = 0;
                    bartender.poseIndex = Math.floor(Math.random() * BARTENDER_POSES.length);
                    bartender.frame = 0;
                }
            }

            // Function to draw the martini glass at any position
            function drawMartiniGlass(x, y, scale, isEmpty) {
                const s = scale || 4;
                // Glass outline - V shape
                ctx.fillStyle = '#c0c0c0';
                // Top rim
                ctx.fillRect(x, y, s * 7, s);
                // Left side of V
                ctx.fillRect(x + s, y + s, s, s);
                ctx.fillRect(x + s * 2, y + s * 2, s, s);
                ctx.fillRect(x + s * 3, y + s * 3, s, s);
                // Right side of V
                ctx.fillRect(x + s * 5, y + s, s, s);
                ctx.fillRect(x + s * 4, y + s * 2, s, s);
                // Stem
                ctx.fillRect(x + s * 3, y + s * 4, s, s * 2);
                // Base
                ctx.fillRect(x + s * 2, y + s * 6, s * 3, s);

                // Only draw liquid and olive if not empty
                if (!isEmpty) {
                    // Dirty martini liquid (greenish)
                    ctx.fillStyle = 'rgba(180, 200, 160, 0.7)';
                    ctx.fillRect(x + s, y + s, s * 5, s);
                    ctx.fillRect(x + s * 2, y + s * 2, s * 3, s);

                    // Olive with pimento
                    ctx.fillStyle = '#556b2f';
                    ctx.fillRect(x + s * 2.5, y + s * 0.5, s * 1.5, s * 1.5);
                    ctx.fillStyle = '#8b0000';
                    ctx.fillRect(x + s * 3, y + s * 0.8, s * 0.6, s * 0.6);
                }
            }

            // Draw martini on counter when ready (full drink waiting)
            if (kittyAtBar.drinkOnBar && !kittyAtBar.pickedUp) {
                drawMartiniGlass(kittyAtBar.drinkX, kittyAtBar.drinkY + 5, 5);
            }

            // Draw flying glass animation (vacuum to Kitty's hand)
            if (kittyAtBar.glassFlying) {
                // Ease out cubic for smooth deceleration
                const t = kittyAtBar.glassFlyProgress;
                const ease = 1 - Math.pow(1 - t, 3);
                const flyX = kittyAtBar.glassStartX + (kittyAtBar.glassTargetX - kittyAtBar.glassStartX) * ease;
                const flyY = kittyAtBar.glassStartY + (kittyAtBar.glassTargetY - kittyAtBar.glassStartY) * ease;
                drawMartiniGlass(flyX, flyY, 5);
            }

            // Draw empty glass on counter (after Kitty returns it)
            if (kittyAtBar.emptyGlassOnBar && !bartenderCleaning.active) {
                drawMartiniGlass(kittyAtBar.drinkX, kittyAtBar.drinkY + 5, 5, true);
            }

            // Spawn stars slowly
            if (stars.length < MAX_STARS && Math.random() < STAR_SPAWN_CHANCE) {
                stars.push(createStar());
            }

            // Update and draw stars with fade in/out
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.life++;

                // Calculate fade: slow fade in, hold, slow fade out
                const progress = star.life / star.maxLife;
                let fadeAlpha;
                if (progress < 0.2) {
                    // Fade in (first 20%)
                    fadeAlpha = progress / 0.2;
                } else if (progress > 0.75) {
                    // Fade out (last 25%)
                    fadeAlpha = (1 - progress) / 0.25;
                } else {
                    fadeAlpha = 1;
                }

                // Subtle twinkle
                const twinkle = Math.sin(star.life * star.twinkleSpeed + star.twinkleOffset);
                const alpha = fadeAlpha * star.brightness * (twinkle * 0.1 + 0.9);

                drawStar(star, alpha);

                if (star.life >= star.maxLife) {
                    stars.splice(i, 1);
                }
            }


            // Random sparkles disabled
            for (let i = randomSparkles.length - 1; i >= 0; i--) {
                const s = randomSparkles[i];
                s.life++;
                // Fade in and out
                const progress = s.life / s.maxLife;
                const alpha = progress < 0.3 ? progress / 0.3 : progress > 0.7 ? (1 - progress) / 0.3 : 1;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = s.color;
                for (let row = 0; row < s.sprite.length; row++) {
                    for (let col = 0; col < s.sprite[row].length; col++) {
                        if (s.sprite[row][col] === 0) continue;
                        ctx.fillRect(
                            (s.x + col * s.scale) * PIXEL_SIZE,
                            (s.y + row * s.scale) * PIXEL_SIZE,
                            PIXEL_SIZE * s.scale,
                            PIXEL_SIZE * s.scale
                        );
                    }
                }
                ctx.globalAlpha = 1;
                if (s.life >= s.maxLife) {
                    randomSparkles.splice(i, 1);
                }
            }

            // Update and draw explosion particles - slow floaty bubble style
            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                const p = explosionParticles[i];
                p.life++;
                p.wobble += p.wobbleSpeed;
                p.x += p.vx + Math.sin(p.wobble) * 0.3; // wobble side to side
                p.y += p.vy;
                p.vy += p.gravity; // light gravity
                p.vx *= 0.995; // very light friction
                p.vy *= 0.995;

                // Fade out
                const progress = p.life / p.maxLife;
                const alpha = 1 - progress;
                const scale = p.scale * (1 - progress * 0.3); // slight shrink

                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                for (let row = 0; row < p.sprite.length; row++) {
                    for (let col = 0; col < p.sprite[row].length; col++) {
                        if (p.sprite[row][col] === 0) continue;
                        ctx.fillRect(
                            (p.x + col * scale) * PIXEL_SIZE,
                            (p.y + row * scale) * PIXEL_SIZE,
                            PIXEL_SIZE * scale,
                            PIXEL_SIZE * scale
                        );
                    }
                }
                ctx.globalAlpha = 1;

                if (p.life >= p.maxLife) {
                    explosionParticles.splice(i, 1);
                }
            }

            // Continuous rain while mouse held down
            if (isMouseDown && Math.random() < 0.3) {
                makeItRain(mouseX, mouseY, 2 + Math.floor(Math.random() * 3));
            }

            // Update and draw flying dollar bills - float up then fall to floor
            const floorY = rows * 0.88;  // floor level
            for (let i = dollarBills.length - 1; i >= 0; i--) {
                const bill = dollarBills[i];
                bill.life++;

                if (!bill.onFloor) {
                    // Flying physics - float up then drift down
                    bill.x += bill.vx;
                    bill.y += bill.vy;
                    bill.vy += 0.018;  // gravity pulls down
                    bill.vx *= 0.992;  // air resistance
                    bill.vy *= 0.995;

                    // Drift toward target landing spot
                    if (bill.targetX !== undefined) {
                        const driftX = (bill.targetX - bill.x) * 0.003;
                        bill.x += driftX;
                    }

                    // Cap falling speed
                    if (bill.vy > 0.7) bill.vy = 0.7;

                    // Dramatic spinning and twirling
                    bill.rotation += bill.rotationSpeed;
                    bill.rotationSpeed += (Math.random() - 0.5) * 0.03;
                    if (Math.abs(bill.rotationSpeed) > 0.5) bill.rotationSpeed *= 0.85;

                    // Sweeping side-to-side flutter
                    bill.wobble += 0.05;
                    bill.x += Math.sin(bill.wobble) * 0.6;
                    bill.y += Math.sin(bill.wobble * 0.7) * 0.2;

                    // Check if landed on floor (with some random variation)
                    const landY = floorY + (Math.random() - 0.5) * 5;
                    if (bill.y >= landY) {
                        bill.y = landY;
                        bill.onFloor = true;
                        bill.floorTime = 0;
                        bill.vy = 0;
                        bill.vx = 0;
                        bill.rotationSpeed = 0;
                        // Flatten rotation to lay flat
                        bill.rotation = Math.round(bill.rotation / (Math.PI/2)) * (Math.PI/2);
                    }
                } else {
                    // On floor - just sit there
                    bill.floorTime++;
                    // Slight settle wobble
                    if (bill.floorTime < 20) {
                        bill.rotation += (Math.random() - 0.5) * 0.02;
                    }
                }

                // Draw the bill
                const twirl = bill.rotation;
                const scaleX = bill.onFloor ? bill.scale : Math.cos(twirl) * bill.scale;
                const scaleY = bill.scale * (bill.onFloor ? 0.3 : (0.8 + Math.sin(twirl * 2) * 0.2));
                const tilt = bill.onFloor ? 0 : Math.sin(twirl) * 0.4;

                for (let row = 0; row < DOLLAR_BILL.length; row++) {
                    for (let col = 0; col < DOLLAR_BILL[row].length; col++) {
                        const pixel = DOLLAR_BILL[row][col];
                        if (pixel === 0) continue;

                        const shimmer = bill.onFloor ? 0.9 : (0.7 + Math.cos(twirl + bill.life * 0.1) * 0.3);
                        ctx.fillStyle = DOLLAR_COLORS[pixel];
                        ctx.globalAlpha = shimmer;

                        const xOffset = tilt * row * 0.3;
                        ctx.fillRect(
                            (bill.x + col * Math.abs(scaleX) + xOffset) * PIXEL_SIZE,
                            (bill.y + row * scaleY) * PIXEL_SIZE,
                            PIXEL_SIZE * Math.abs(scaleX),
                            PIXEL_SIZE * scaleY
                        );
                    }
                }
                ctx.globalAlpha = 1;

                // Remove bills after sitting on floor for 30 seconds (~1800 frames at 60fps)
                if (bill.onFloor && bill.floorTime > 1800) {
                    dollarBills.splice(i, 1);
                } else if (!bill.onFloor && bill.life > 600) {
                    dollarBills.splice(i, 1);
                }
            }

            // Update Anna - pole dancing or walking
            anna.frameTimer++;
            
            // === POLE DANCING STATE ===
            if (anna.poleDancing) {
                // Position Anna on left or right side of pole (tight to pole)
                let poleX;
                if (anna.poleSide === 'left') {
                    poleX = pole.x - 8;  // left of pole, tight
                    anna.flip = false;
                } else {
                    poleX = pole.x - 4;  // right of pole, tight
                    anna.flip = true;
                }
                anna.x = poleX;
                
                // Get climb and slide poses
                const climbPose = POLE_POSES.find(p => p.name === 'climb');
                const slidePose = POLE_POSES.find(p => p.name === 'slide');
                
                // === CLIMBING TO MID STATE ===
                if (anna.poleState === 'climbing_mid') {
                    // Animate climb frames
                    if (anna.frameTimer > 10) {
                        anna.frameTimer = 0;
                        anna.frame = (anna.frame + 1) % climbPose.frames.length;
                    }
                    
                    // Move up the pole
                    anna.poleY -= anna.climbSpeed;
                    
                    // Reached the middle? Do split_left!
                    const middleY = pole.topY + (pole.bottomY - pole.topY) * 0.5;
                    if (anna.poleY <= middleY) {
                        anna.poleY = middleY;
                        anna.poleState = 'split_left';
                        anna.splitTimer = 0;
                        anna.frame = 0;
                    }
                    
                    anna.y = anna.poleY;
                    
                    // Draw climb sprite
                    const climbSprite = climbPose.frames[anna.frame % climbPose.frames.length];
                    drawSprite(climbSprite, anna.x, anna.y, anna.scale, anna.flip);
                
                // === SPLIT LEFT STATE (horizontal split at middle - body left, legs right) ===
                } else if (anna.poleState === 'split_left') {
                    const splitPose = POLE_POSES.find(p => p.name === 'split_top_left');
                    
                    // Position for horizontal split - shift left so pole is in middle of body
                    anna.x = pole.x - 18;
                    anna.flip = false;
                    
                    // Hold the pose
                    anna.splitTimer++;
                    
                    // Done holding? Continue climbing to top
                    if (anna.splitTimer >= anna.splitDuration) {
                        anna.poleState = 'climbing_top';
                        anna.splitTimer = 0;
                        anna.x = pole.x - 8;  // reset position for climbing
                        anna.frame = 0;
                    }
                    
                    // Draw split sprite
                    const splitSprite = splitPose.frames[0];
                    drawSprite(splitSprite, anna.x, anna.y, anna.scale, anna.flip);
                
                // === CLIMBING TO TOP STATE ===
                } else if (anna.poleState === 'climbing_top') {
                    // Animate climb frames
                    if (anna.frameTimer > 10) {
                        anna.frameTimer = 0;
                        anna.frame = (anna.frame + 1) % climbPose.frames.length;
                    }
                    
                    // Move up the pole
                    anna.poleY -= anna.climbSpeed;
                    
                    // Reached the top? Do split_right!
                    const topY = pole.topY + 20;
                    if (anna.poleY <= topY) {
                        anna.poleY = topY;
                        anna.poleState = 'split_right';
                        anna.splitTimer = 0;
                        anna.frame = 0;
                    }
                    
                    anna.y = anna.poleY;
                    
                    // Draw climb sprite
                    const climbSprite = climbPose.frames[anna.frame % climbPose.frames.length];
                    drawSprite(climbSprite, anna.x, anna.y, anna.scale, anna.flip);
                
                // === SPLIT RIGHT STATE (horizontal split at top - body right, legs left / mirrored) ===
                } else if (anna.poleState === 'split_right') {
                    const splitPose = POLE_POSES.find(p => p.name === 'split_top_right');
                    
                    // Position for horizontal split - shift right since flipped
                    anna.x = pole.x - 2;
                    anna.flip = true;
                    
                    // Hold the pose
                    anna.splitTimer++;
                    
                    // Done holding? Start spinning down
                    if (anna.splitTimer >= anna.splitDuration) {
                        anna.poleState = 'spinning';
                        anna.spinAngle = 0;
                        anna.splitTimer = 0;
                        anna.x = pole.x - 8;  // reset position
                        anna.flip = false;
                    }
                    
                    // Draw split sprite (flipped)
                    const splitSprite = splitPose.frames[0];
                    drawSprite(splitSprite, anna.x, anna.y, anna.scale, anna.flip);
                
                // === SPINNING STATE (coming down while spinning) ===
                } else if (anna.poleState === 'spinning') {
                    const spinPose = POLE_POSES.find(p => p.name === 'spin');
                    
                    // Rotate around the pole
                    anna.spinAngle += anna.spinSpeed;
                    
                    // Move down while spinning
                    anna.poleY += anna.slideSpeed * 0.5;  // slower descent while spinning
                    
                    // Calculate position around pole based on angle (smaller radius)
                    const spinRadius = 2;  // very small left-right movement
                    const angleRad = anna.spinAngle * Math.PI / 180;
                    const offsetX = Math.sin(angleRad) * spinRadius;
                    
                    // Position swings left and right of pole (centered on pole)
                    const poleCenter = pole.x + pole.width / 2;
                    const spriteOffset = 10;
                    anna.x = poleCenter - spriteOffset + offsetX;
                    anna.y = anna.poleY;
                    
                    // Flip based on which side of pole she's on
                    anna.flip = offsetX > 0;
                    
                    // Reached the middle? Do Iron X!
                    const middleY = pole.topY + (pole.bottomY - pole.topY) * 0.5;
                    if (anna.poleY >= middleY) {
                        anna.poleY = middleY;
                        anna.poleState = 'iron_x';
                        anna.ironXTimer = 0;
                        anna.x = pole.x - 8;  // center on pole
                        anna.flip = false;
                    }
                    
                    // Draw spin sprite
                    const spinSprite = spinPose.frames[0];
                    drawSprite(spinSprite, anna.x, anna.y, anna.scale, anna.flip);
                
                // === IRON X STATE (holding pose) ===
                } else if (anna.poleState === 'iron_x') {
                    const ironXPose = POLE_POSES.find(p => p.name === 'iron_x');
                    
                    // Position so hands appear on pole
                    anna.x = pole.x - 12;  // shift left so hands grip pole
                    
                    // Hold the pose
                    anna.ironXTimer++;
                    
                    // Done holding? Start iron_x_advanced (sliding down while in iron_x)
                    if (anna.ironXTimer >= anna.ironXDuration) {
                        anna.poleState = 'iron_x_advanced';
                        anna.ironXTimer = 0;
                    }
                    
                    // Draw iron X sprite
                    const ironXSprite = ironXPose.frames[0];
                    drawSprite(ironXSprite, anna.x, anna.y, anna.scale, anna.flip);
                
                // === IRON X ADVANCED STATE (sliding down while holding iron_x pose) ===
                } else if (anna.poleState === 'iron_x_advanced') {
                    const ironXPose = POLE_POSES.find(p => p.name === 'iron_x_advanced');
                    
                    // Position so hands appear on pole
                    anna.x = pole.x - 12;
                    
                    // Slide down while holding iron_x pose
                    anna.poleY += anna.slideSpeed;
                    anna.y = anna.poleY;
                    
                    // Reached the bottom? Done with routine
                    const bottomY = pole.bottomY - 30;
                    if (anna.poleY >= bottomY) {
                        anna.poleY = bottomY;
                        anna.poleDancing = false;
                        anna.poleState = 'none';
                        anna.x = pole.x - 8;
                    }
                    
                    // Draw iron X sprite
                    const ironXSprite = ironXPose.frames[0];
                    drawSprite(ironXSprite, anna.x, anna.y, anna.scale, anna.flip);
                    
                // === SLIDING STATE ===
                } else if (anna.poleState === 'sliding') {
                    // Slide sprite doesn't animate (legs straight)
                    
                    // Move down the pole
                    anna.poleY += anna.slideSpeed;
                    
                    // Reached the bottom?
                    const bottomY = pole.bottomY - 30;
                    if (anna.poleY >= bottomY) {
                        anna.poleY = bottomY;
                        // Done! Return to walking
                        anna.poleDancing = false;
                        anna.poleState = 'none';
                        anna.dirX = -1;
                        anna.dirY = 0;
                    }
                    
                    anna.y = anna.poleY;
                    
                    // Draw slide sprite
                    const slideSprite = slidePose.frames[0];
                    drawSprite(slideSprite, anna.x, anna.y, anna.scale, anna.flip);
                }
                
                // Sparkle effect while on pole
                if (Math.random() < 0.1) {
                    randomSparkles.push({
                        x: anna.x + Math.random() * 15,
                        y: anna.y + Math.random() * 20,
                        sprite: [SPARKLE_4PT, SPARKLE_8PT, SPARKLE_DIAMOND][Math.floor(Math.random() * 3)],
                        color: ['#ffd700', '#ff69b4', '#ffffff', '#ff1493'][Math.floor(Math.random() * 4)],
                        scale: 0.3 + Math.random() * 0.4,
                        life: 0,
                        maxLife: 20 + Math.random() * 15,
                    });
                }
                
            // === WALKING TO POLE STATE ===
            } else if (anna.walkingToPole) {
                if (anna.frameTimer > 12) {
                    anna.frameTimer = 0;
                    anna.frame = (anna.frame + 1) % POSES[anna.poseIndex].frames.length;
                }
                
                // Walk toward the correct side of the pole
                let targetX;
                if (anna.poleSide === 'left') {
                    targetX = pole.x - 8;  // left side, tight
                } else {
                    targetX = pole.x - 4;  // right side, tight
                }
                const targetY = pole.bottomY - 30;  // start at bottom of pole
                const dx = targetX - anna.x;
                const dy = targetY - anna.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 5) {
                    // Walk toward pole
                    anna.x += (dx / dist) * anna.walkSpeed * 1.2;
                    anna.y += (dy / dist) * anna.walkSpeed * 1.2;
                    anna.flip = dx < 0;
                } else {
                    // Arrived at pole - start climbing!
                    anna.walkingToPole = false;
                    anna.poleDancing = true;
                    anna.poleState = 'climbing_mid';
                    anna.poleY = pole.bottomY - 30;  // start at bottom
                    anna.frame = 0;
                    // Flip based on side (face the pole)
                    anna.flip = (anna.poleSide === 'right');
                }
                
                // Draw walking Anna
                const pose = POSES[anna.poseIndex];
                const sprite = pose.frames[anna.frame % pose.frames.length];
                drawSprite(sprite, anna.x, anna.y, anna.scale, anna.flip);
                
            // === NORMAL WALKING/COLLECTING STATE ===
            } else {
                if (anna.frameTimer > 12) {
                    anna.frameTimer = 0;
                    anna.frame = (anna.frame + 1) % POSES[anna.poseIndex].frames.length;
                }
                
                // Check for money on floor (only react when it lands)
                const floorBills = dollarBills.filter(b => b.onFloor);
                const moneyOnFloor = floorBills.length > 0;
                const moneyFloorY = rows * 0.82;
                anna.collecting = moneyOnFloor;

                if (moneyOnFloor) {
                    // Money on floor! Walk down to collect it
                    if (anna.y < moneyFloorY - 5) {
                        anna.y += anna.walkSpeed;
                        anna.x += anna.dirX * anna.walkSpeed * 0.3;
                    } else {
                        // Find nearest floor bill
                        let nearestBill = null;
                        let nearestDist = Infinity;
                        for (const bill of floorBills) {
                            const dist = Math.abs(bill.x - anna.x);
                            if (dist < nearestDist) {
                                nearestDist = dist;
                                nearestBill = bill;
                            }
                        }

                        if (nearestBill) {
                            const dx = nearestBill.x - anna.x;
                            if (Math.abs(dx) > 5) {
                                anna.dirX = Math.sign(dx);
                            }
                        }

                        anna.x += anna.dirX * anna.walkSpeed;
                        anna.y = moneyFloorY;
                    }

                    if (anna.dirX < -0.3) anna.flip = true;
                    else if (anna.dirX > 0.3) anna.flip = false;

                } else {
                    // No money - wander randomly
                    anna.x += anna.dirX * anna.walkSpeed;
                    anna.y += anna.dirY * anna.walkSpeed;

                    if (anna.dirX < -0.3) anna.flip = true;
                    else if (anna.dirX > 0.3) anna.flip = false;

                    // Bounce at edges
                    if (anna.x > cols * 0.8) {
                        anna.dirX = -Math.abs(anna.dirX);
                    } else if (anna.x < cols * 0.1) {
                        anna.dirX = Math.abs(anna.dirX);
                    }
                    if (anna.y > rows * 0.7) {
                        anna.dirY = -Math.abs(anna.dirY);
                    } else if (anna.y < rows * 0.3) {
                        anna.dirY = Math.abs(anna.dirY);
                    }

                    if (Math.random() < 0.008) {
                        anna.dirX = (Math.random() - 0.5) * 2;
                        anna.dirY = (Math.random() - 0.5) * 1;
                    }
                }

                // Keep within bounds
                if (anna.x > cols * 0.85) anna.x = cols * 0.85;
                if (anna.x < cols * 0.05) anna.x = cols * 0.05;

                // Keep off the bar area
                if (anna.x < 58 && anna.y > 35) {
                    anna.x = 58;
                    anna.dirX = Math.abs(anna.dirX);
                }

                // Vacuum and collect money near Anna
                const bagX = anna.x + (anna.flip ? 6 : 19);
                const bagY = anna.y + 18;

                for (let i = dollarBills.length - 1; i >= 0; i--) {
                    const bill = dollarBills[i];
                    if (bill.onFloor) {
                        const dx = bill.x - bagX;
                        const dy = bill.y - bagY;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 40 && dist > 8) {
                            const pullStrength = 0.15;
                            bill.x -= dx * pullStrength;
                            bill.y -= dy * pullStrength;
                            bill.scale *= 0.98;
                        }

                        if (dist < 10) {
                            dollarBills.splice(i, 1);
                            anna.tips++;
                            for (let p = 0; p < 5; p++) {
                                randomSparkles.push({
                                    x: bagX + (Math.random() - 0.5) * 8,
                                    y: bagY + (Math.random() - 0.5) * 8,
                                    sprite: SPARKLE_4PT,
                                    color: ['#85bb65', '#ffd700', '#ff69b4'][Math.floor(Math.random() * 3)],
                                    scale: 0.4 + Math.random() * 0.3,
                                    life: 0,
                                    maxLife: 15 + Math.random() * 10,
                                });
                            }
                        }
                    }
                }

                // Draw Anna with butt shake
                const pose = POSES[anna.poseIndex];
                const sprite = pose.frames[anna.frame % pose.frames.length];
                let annaShakeX = 0;
                if (anna.shakeTimer > 0) {
                    anna.shakeTimer--;
                    annaShakeX = Math.sin(anna.shakeTimer * 0.8) * 1.5;
                }
                drawSprite(sprite, anna.x + annaShakeX, anna.y, anna.scale, anna.flip);

                // Draw handbag when collecting money
                if (anna.collecting) {
                    const bagScale = 1.2;
                    const bagOffsetX = anna.flip ? 3 : 16;
                    const bagOffsetY = 14;
                    const shimmer = 0.85 + Math.sin(Date.now() * 0.008) * 0.15;

                    for (let row = 0; row < HANDBAG.length; row++) {
                        for (let col = 0; col < HANDBAG[row].length; col++) {
                            const pixel = HANDBAG[row][col];
                            if (pixel === 0) continue;
                            ctx.fillStyle = HANDBAG_COLORS[pixel];
                            ctx.globalAlpha = pixel === 2 ? shimmer : 1;
                            ctx.fillRect(
                                (anna.x + bagOffsetX + col * bagScale) * PIXEL_SIZE,
                                (anna.y + bagOffsetY + row * bagScale) * PIXEL_SIZE,
                                PIXEL_SIZE * bagScale,
                                PIXEL_SIZE * bagScale
                            );
                        }
                    }
                    ctx.globalAlpha = 1;
                }
            }

            // Update Hello Kitty - walk around randomly
            kitty.frameTimer++;
            if (kitty.frameTimer > 12) {
                kitty.frameTimer = 0;
                kitty.frame = (kitty.frame + 1) % KITTY_POSES[kitty.poseIndex].frames.length;
            }

            // Kitty waiting for drink - wander around
            if (kittyAtBar.waitingForDrink) {
                kitty.poseIndex = 0; // walking
                kitty.x += kitty.dirX * kitty.walkSpeed;
                kitty.y += kitty.dirY * kitty.walkSpeed;
                kitty.flip = kitty.dirX < 0;
                // Bounce at edges but stay away from bar
                if (kitty.x > cols * 0.8) kitty.dirX = -Math.abs(kitty.dirX);
                if (kitty.x < 60) kitty.dirX = Math.abs(kitty.dirX);
                if (kitty.y > rows * 0.7) kitty.dirY = -Math.abs(kitty.dirY);
                if (kitty.y < rows * 0.3) kitty.dirY = Math.abs(kitty.dirY);
                // Don't cross the pole when Anna is dancing
                if (anna.poleDancing || anna.walkingToPole) {
                    if (kitty.x > pole.x - 15 && kitty.x < pole.x + 15) {
                        // Push kitty to whichever side she's closer to
                        if (kitty.x < pole.x) {
                            kitty.x = pole.x - 15;
                            kitty.dirX = -Math.abs(kitty.dirX);
                        } else {
                            kitty.x = pole.x + 15;
                            kitty.dirX = Math.abs(kitty.dirX);
                        }
                    }
                }
                // Random direction changes
                if (Math.random() < 0.01) {
                    kitty.dirX = (Math.random() - 0.3) * 1.5;  // bias toward right
                    kitty.dirY = (Math.random() - 0.5) * 0.8;
                }
            }
            // Kitty cheering when drink is ready!
            else if (kittyAtBar.cheering) {
                kitty.poseIndex = 2; // cheering pose
                kittyAtBar.cheerTimer--;
                if (kittyAtBar.cheerTimer <= 0) {
                    kittyAtBar.cheering = false;
                }
            }
            // Hello Kitty going to bar for martini - after cheering
            else if (kittyAtBar.visiting && kittyAtBar.drinkOnBar && !kittyAtBar.pickedUp) {
                // Walk to the right side of the bar (customer side) to pick up drink
                const barTargetX = (barX + barWidth + 50) / PIXEL_SIZE;
                const barTargetY = (barY + 50) / PIXEL_SIZE;
                const dx = barTargetX - kitty.x;
                const dy = barTargetY - kitty.y;

                kitty.poseIndex = 0; // walking
                kitty.x += Math.sign(dx) * 0.4;
                kitty.y += Math.sign(dy) * 0.3;
                kitty.flip = dx < 0;

                // If close to bar, start glass flying animation!
                if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && !kittyAtBar.glassFlying) {
                    kittyAtBar.glassFlying = true;
                    kittyAtBar.glassFlyProgress = 0;
                    kittyAtBar.drinkOnBar = false;
                    // Start position: on the counter
                    kittyAtBar.glassStartX = kittyAtBar.drinkX;
                    kittyAtBar.glassStartY = kittyAtBar.drinkY + 5;
                    kitty.poseIndex = 4; // drinking pose (ready to receive)
                    kitty.flip = true; // face the bar
                }
            } else if (kittyAtBar.glassFlying && !kittyAtBar.pickedUp) {
                // Animate glass flying to Kitty's hand
                kittyAtBar.glassFlyProgress += 0.08;

                // Calculate target: Kitty's hand position (holding pose)
                const spriteScale = kitty.scale;
                const glassScale = 5;
                const armOffset = kitty.flip ? -3 : 14 * spriteScale;
                const handX = (kitty.x + armOffset) * PIXEL_SIZE;
                const handY = (kitty.y + 7 * spriteScale) * PIXEL_SIZE - (glassScale * 3.5);
                kittyAtBar.glassTargetX = handX;
                kittyAtBar.glassTargetY = handY;

                if (kittyAtBar.glassFlyProgress >= 1) {
                    // Animation complete - Kitty now has the drink
                    kittyAtBar.glassFlying = false;
                    kittyAtBar.pickedUp = true;
                    kittyAtBar.drinkTimer = 0;
                    kittyAtBar.drinkDuration = 1800 + Math.random() * 900; // 30-45 sec
                    kittyAtBar.glassEmpty = false; // fresh drink
                    kittyAtBar.glassCurrentX = 0; // reset for smooth animation
                    kittyAtBar.glassCurrentY = 0;
                    // Start moving away from bar
                    kitty.dirX = (Math.random() - 0.5) * 2;
                    kitty.dirY = -0.5;
                }
            } else if (kittyAtBar.pickedUp && !kittyAtBar.returning) {
                // Walking around with the martini - normal behavior but holding drink
                kitty.poseIndex = 4; // drinking pose
                kittyAtBar.drinkTimer++;

                // Normal walking - check for money (same as regular walking)
                const floorBills = dollarBills.filter(b => b.onFloor);
                let collectingMoney = false;

                if (floorBills.length > 0 && Math.random() < 0.02) {
                    let nearestBill = null;
                    let nearestDist = Infinity;
                    for (const bill of floorBills) {
                        const dist = Math.abs(bill.x - kitty.x) + Math.abs(bill.y - kitty.y);
                        if (dist < nearestDist) {
                            nearestDist = dist;
                            nearestBill = bill;
                        }
                    }
                    if (nearestBill && nearestDist < 100) {
                        const dx = nearestBill.x - kitty.x;
                        const dy = nearestBill.y - kitty.y;
                        kitty.dirX = Math.sign(dx) * 1.5;
                        kitty.dirY = Math.sign(dy) * 0.8;
                        collectingMoney = true;
                        if (nearestDist < 15) {
                            const billIndex = dollarBills.indexOf(nearestBill);
                            if (billIndex > -1) {
                                dollarBills.splice(billIndex, 1);
                                randomSparkles.push({
                                    x: kitty.x + 5, y: kitty.y - 5,
                                    sprite: SPARKLE_8PT, color: '#85bb65',
                                    scale: 0.8, life: 0, maxLife: 30,
                                });
                            }
                        }
                    }
                }

                // Normal movement
                if (!collectingMoney) {
                    kitty.x += kitty.dirX * kitty.walkSpeed;
                    kitty.y += kitty.dirY * kitty.walkSpeed;
                } else {
                    kitty.x += kitty.dirX * kitty.walkSpeed * 0.8;
                    kitty.y += kitty.dirY * kitty.walkSpeed * 0.8;
                }
                kitty.flip = kitty.dirX < 0;

                // Bounce at edges
                if (kitty.x > cols * 0.8) kitty.dirX = -Math.abs(kitty.dirX);
                else if (kitty.x < cols * 0.1) kitty.dirX = Math.abs(kitty.dirX);
                if (kitty.y > rows * 0.7) kitty.dirY = -Math.abs(kitty.dirY);
                else if (kitty.y < rows * 0.3) kitty.dirY = Math.abs(kitty.dirY);

                // Keep off the bar area (bar is x < 58 grid units, y > 35 grid units)
                if (kitty.x < 58 && kitty.y > 35) {
                    kitty.x = 58;
                    kitty.dirX = Math.abs(kitty.dirX);  // bounce away from bar
                }

                // Don't cross the pole when Anna is dancing
                if (anna.poleDancing || anna.walkingToPole) {
                    if (kitty.x > pole.x - 15 && kitty.x < pole.x + 15) {
                        if (kitty.x < pole.x) {
                            kitty.x = pole.x - 15;
                            kitty.dirX = -Math.abs(kitty.dirX);
                        } else {
                            kitty.x = pole.x + 15;
                            kitty.dirX = Math.abs(kitty.dirX);
                        }
                    }
                }

                // Randomly change direction
                if (Math.random() < 0.008) {
                    kitty.dirX = (Math.random() - 0.5) * 2;
                    kitty.dirY = (Math.random() - 0.5) * 1;
                }

                // Glass becomes empty at 90% through drinking
                if (kittyAtBar.drinkTimer > kittyAtBar.drinkDuration * 0.9) {
                    kittyAtBar.glassEmpty = true;
                }

                // Done drinking after 30-45 seconds
                if (kittyAtBar.drinkTimer > kittyAtBar.drinkDuration) {
                    kittyAtBar.returning = true;
                }
            } else if (kittyAtBar.returning) {
                // Walk back to the right side of the bar to return empty glass
                const barTargetX = (barX + barWidth + 50) / PIXEL_SIZE;
                const barTargetY = (barY + 50) / PIXEL_SIZE;
                const dx = barTargetX - kitty.x;
                const dy = barTargetY - kitty.y;

                kitty.poseIndex = 4; // drinking pose (has glass in sprite)
                kitty.x += Math.sign(dx) * 0.3;
                kitty.y += Math.sign(dy) * 0.25;
                kitty.flip = dx < 0;

                // If back at bar, put empty glass down on counter
                if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
                    kittyAtBar.pickedUp = false;
                    kittyAtBar.returning = false;
                    kittyAtBar.emptyGlassOnBar = true; // empty glass now on counter
                    kittyAtBar.drinkTimer = 0;
                    kittyAtBar.visiting = false; // visit complete
                    kittyAtBar.cooldown = 300 + Math.random() * 200; // wait before next visit
                }
            } else if (KITTY_POSES[kitty.poseIndex].name === 'walking' || KITTY_POSES[kitty.poseIndex].name === 'drinking') {
                // Normal walking - check for money
                const floorBills = dollarBills.filter(b => b.onFloor);
                let collectingMoney = false;

                if (floorBills.length > 0 && Math.random() < 0.02) {
                    // Find nearest floor bill
                    let nearestBill = null;
                    let nearestDist = Infinity;
                    for (const bill of floorBills) {
                        const dist = Math.abs(bill.x - kitty.x) + Math.abs(bill.y - kitty.y);
                        if (dist < nearestDist) {
                            nearestDist = dist;
                            nearestBill = bill;
                        }
                    }

                    if (nearestBill && nearestDist < 100) {
                        // Move toward the bill
                        const dx = nearestBill.x - kitty.x;
                        const dy = nearestBill.y - kitty.y;
                        kitty.dirX = Math.sign(dx) * 1.5;
                        kitty.dirY = Math.sign(dy) * 0.8;
                        collectingMoney = true;

                        // If very close, collect the bill!
                        if (nearestDist < 15) {
                            const billIndex = dollarBills.indexOf(nearestBill);
                            if (billIndex > -1) {
                                dollarBills.splice(billIndex, 1);
                                // Little celebration sparkle
                                randomSparkles.push({
                                    x: kitty.x + 5,
                                    y: kitty.y - 5,
                                    sprite: SPARKLE_8PT,
                                    color: '#85bb65',  // money green sparkle
                                    scale: 0.8,
                                    life: 0,
                                    maxLife: 30,
                                });
                            }
                        }
                    }
                }

                if (!collectingMoney) {
                    kitty.x += kitty.dirX * kitty.walkSpeed;
                    kitty.y += kitty.dirY * kitty.walkSpeed;
                } else {
                    kitty.x += kitty.dirX * kitty.walkSpeed * 0.8;
                    kitty.y += kitty.dirY * kitty.walkSpeed * 0.8;
                }
                kitty.flip = kitty.dirX < 0;

                // Bounce at edges
                if (kitty.x > cols * 0.8) {
                    kitty.dirX = -Math.abs(kitty.dirX);
                } else if (kitty.x < cols * 0.1) {
                    kitty.dirX = Math.abs(kitty.dirX);
                }
                if (kitty.y > rows * 0.7) {
                    kitty.dirY = -Math.abs(kitty.dirY);
                } else if (kitty.y < rows * 0.3) {
                    kitty.dirY = Math.abs(kitty.dirY);
                }

                // Keep off the bar area (bar is x < 58 grid units, y > 35 grid units)
                if (kitty.x < 58 && kitty.y > 35) {
                    kitty.x = 58;
                    kitty.dirX = Math.abs(kitty.dirX);
                }

                // Don't cross the pole when Anna is dancing
                if (anna.poleDancing || anna.walkingToPole) {
                    if (kitty.x > pole.x - 15 && kitty.x < pole.x + 15) {
                        if (kitty.x < pole.x) {
                            kitty.x = pole.x - 15;
                            kitty.dirX = -Math.abs(kitty.dirX);
                        } else {
                            kitty.x = pole.x + 15;
                            kitty.dirX = Math.abs(kitty.dirX);
                        }
                    }
                }

                // Randomly change direction (less often when collecting)
                if (Math.random() < 0.008) {
                    kitty.dirX = (Math.random() - 0.5) * 2;
                    kitty.dirY = (Math.random() - 0.5) * 1;
                }
            }

            kitty.poseTimer++;
            if (kitty.poseTimer > KITTY_POSES[kitty.poseIndex].duration / 16) {
                kitty.poseTimer = 0;
                // Randomize next pose
                let newPose = Math.floor(Math.random() * KITTY_POSES.length);
                while (newPose === kitty.poseIndex && KITTY_POSES.length > 1) {
                    newPose = Math.floor(Math.random() * KITTY_POSES.length);
                }
                kitty.poseIndex = newPose;
                kitty.frame = 0;
            }

            // Draw Hello Kitty with butt shake (and throwing animation)
            let kittySprite;
            if (kitty.throwTimer > 0) {
                // Use throwing sprite
                kitty.throwTimer--;
                kittySprite = kitty.throwTimer > 10 ? KITTY_THROW_1 : KITTY_THROW_2;
            } else {
                const kittyPose = KITTY_POSES[kitty.poseIndex];
                kittySprite = kittyPose.frames[kitty.frame % kittyPose.frames.length];
            }
            let kittyShakeX = 0;
            if (kitty.shakeTimer > 0) {
                kitty.shakeTimer--;
                kittyShakeX = Math.sin(kitty.shakeTimer * 0.8) * 2;
            }
            drawKitty(kittySprite, kitty.x + kittyShakeX, kitty.y, kitty.scale, kitty.flip);

            // Draw martini separately when Kitty has drink
            if (kittyAtBar.pickedUp && kitty.poseIndex === 4) {
                const glassScale = 5;
                const spriteScale = kitty.scale; // 2.5

                // Use a slow timer for hold/sip cycle (not tied to animation frames)
                // Cycle: hold for ~120 frames, sip for ~60 frames
                const sipCycle = 180; // total cycle length
                const sipStart = 120; // sipping starts at frame 120
                const cycleFrame = Math.floor(Date.now() / 50) % sipCycle;
                const isSipping = cycleFrame >= sipStart;

                // Calculate target positions
                let targetX, targetY;
                if (isSipping) {
                    // SIPPING: Glass centered under face
                    const centerOffset = 7.5 * spriteScale - (7 * glassScale / 2) / PIXEL_SIZE;
                    targetX = (kitty.x + kittyShakeX + centerOffset) * PIXEL_SIZE;
                    targetY = (kitty.y + 6 * spriteScale) * PIXEL_SIZE;
                } else {
                    // HOLDING: Glass to the side
                    const armOffset = kitty.flip ? -3 : 14 * spriteScale;
                    targetX = (kitty.x + kittyShakeX + armOffset) * PIXEL_SIZE;
                    targetY = (kitty.y + 7 * spriteScale) * PIXEL_SIZE - (glassScale * 3.5);
                }

                // Initialize glass position if not set
                if (!kittyAtBar.glassCurrentX) {
                    kittyAtBar.glassCurrentX = targetX;
                    kittyAtBar.glassCurrentY = targetY;
                }

                // Smoothly interpolate glass position
                const lerpSpeed = 0.15;
                kittyAtBar.glassCurrentX += (targetX - kittyAtBar.glassCurrentX) * lerpSpeed;
                kittyAtBar.glassCurrentY += (targetY - kittyAtBar.glassCurrentY) * lerpSpeed;

                drawMartiniGlass(kittyAtBar.glassCurrentX, kittyAtBar.glassCurrentY, glassScale, kittyAtBar.glassEmpty);
            }

            // Draw neon sign title - "Kittie's" - realistic hot pink neon
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '300 85px "Pacifico", "Brush Script MT", "Segoe Script", cursive';

            const centerX = canvas.width / 2;
            const baseY = 110;
            const text = "Kittie\u2019s";  // curly apostrophe

            // Subtle flicker animation
            const flicker = 0.92 + Math.sin(Date.now() * 0.008) * 0.08;

            // Layer 1: Outermost glow - large blur, faint pink
            ctx.shadowColor = '#ff1493';
            ctx.shadowBlur = 120 * flicker;
            ctx.fillStyle = 'rgba(255, 20, 147, 0.15)';
            ctx.fillText(text, centerX, baseY);

            // Layer 2: Outer glow - hot pink spread
            ctx.shadowColor = '#ff1493';
            ctx.shadowBlur = 80 * flicker;
            ctx.fillStyle = 'rgba(255, 20, 147, 0.25)';
            ctx.fillText(text, centerX, baseY);

            // Layer 3: Mid glow - pink aura
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 40 * flicker;
            ctx.fillStyle = 'rgba(255, 105, 180, 0.4)';
            ctx.fillText(text, centerX, baseY);

            // Layer 4: Inner glow - brighter pink
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff1493';
            ctx.fillText(text, centerX, baseY);

            // Layer 5: Tight glow - light pink
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#ff69b4';
            ctx.fillText(text, centerX, baseY);

            // Layer 6: Hot pink core edge
            ctx.shadowColor = '#ffb6c1';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#ff85a2';
            ctx.fillText(text, centerX, baseY);

            // Layer 7: Light pink center - the tube itself
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffb6c1';
            ctx.fillText(text, centerX, baseY);

            ctx.restore();

            // Anna's Tips counter - green money style (top right)
            ctx.save();
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.shadowColor = '#00ff00';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#85bb65';  // money green
            ctx.fillText('Tips: $' + anna.tips, canvas.width - 20, 35);
            ctx.restore();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
